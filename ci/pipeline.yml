jobs:

- name: set-self
  plan:
    - get: src
      trigger: true
    - set_pipeline: self
      file: src/ci/pipeline.yml

- name: upload
  plan:
  - in_parallel:
      steps:
      - get: src
        resource: src
        passed: [set-self]
        trigger: true
      - get: gh-release
      - get: daily-timer
        trigger: true
  - file: src/ci/scripts/sync-github-with-s3.yml
    params:
      ACCESS_TOKEN: ((github-access-token))
      AWS_DEFAULT_REGION: ((aws-region))
    task: upload-to-s3
  on_failure:
    put: slack
    params: 
      text: |
        :x: upload backup job failed for github to s3
        <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|View build details>
      channel: ((slack-channel-failure))
      username: ((slack-username))
      icon_url: ((slack-icon-url))

resource_types:
- name: slack-notification
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_region: us-gov-west-1
    aws_secret_access_key: ((ecr_aws_secret))
    repository: slack-notification-resource
    tag: latest
  type: registry-image


resources:
- name: daily-timer
  source:
    interval: 24h
  type: time
- check_every: 1h0m0s
  name: gh-release
  source:
    access_token: ((github-access-token))
    owner: cli
    repository: cli
  type: github-release
- name: slack
  source:
    url: ((slack-webhook-url))
  type: slack-notification
- check_every: 10s
  icon: github-circle
  name: src
  source:
    branch: test
    commit_verification_keys: ((cloud-gov-pgp-keys))
    uri: https://github.com/cloud-gov/upload-github-to-s3
  type: git

resource_types:
  - name: slack-notification
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: slack-notification-resource
      aws_region: us-gov-west-1
      tag: latest
  - name: git
    type: registry-image
    source:
      aws_access_key_id: ((ecr_aws_key))
      aws_secret_access_key: ((ecr_aws_secret))
      repository: git-resource
      aws_region: us-gov-west-1
      tag: latest